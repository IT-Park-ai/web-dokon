<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tovar kiritish - Do'kon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
.split{display:grid;grid-template-columns:380px minmax(0,1fr);gap:1.5rem;align-items:start}
.formcard{position:sticky;top:1.25rem;padding:1.4rem}
.formcard h2{font-size:1.2rem;margin-bottom:.2rem}
.formcard .hint{color:var(--muted);font-size:.9rem;margin:0 0 1.1rem}
.formcard .foot{display:flex;gap:.6rem;margin-top:1.1rem}
.formcard .foot .btn{flex:1;padding:.8rem 1rem}
.dupe{margin-top:.6rem;background:var(--brass-soft);border-radius:10px;padding:.6rem .8rem;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.plist .tr{grid-template-columns:minmax(150px,2.2fr) minmax(80px,1fr) minmax(80px,1fr) minmax(80px,1fr) auto}
.count-line{color:var(--muted);font-size:.9rem;margin-bottom:.6rem}
@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .formcard{position:static}
}
@media (max-width:860px){
  .plist .tr{grid-template-columns:1fr 1fr;padding:1rem}
  .plist .tr>*:first-child{grid-column:1/-1}
  .plist .tr .acts{grid-column:1/-1;justify-content:flex-start}
}
</style>
</head>
<body data-page="input">
<div class="app">
<aside class="side" id="side"></aside>
<main class="main">

  <div class="page-head">
    <div><h1>Tovar kiritish</h1><p class="sub" id="sub"></p></div>
  </div>

  <div class="split">
    <form class="card formcard" id="form" autocomplete="off">
      <h2 id="fTitle">Yangi tovar</h2>
      <p class="hint">Masalan: Cola 0.5 l, 24 dona, kelgan narxi 6 000, sotish narxi 8 000.</p>
      <div class="grid2">
        <div class="full"><label for="fName">Nomi</label><input class="inp" id="fName" required maxlength="120" list="names" autofocus>
          <datalist id="names"></datalist>
          <div class="dupe" id="dupe" hidden><span id="dupeTxt"></span><button type="button" class="btn sm" id="dupeBtn">Kirim</button></div>
        </div>
        <div class="full"><label for="fCat">Turkum (ixtiyoriy)</label><input class="inp" id="fCat" maxlength="60" placeholder="Ichimliklar, non, sut..." list="cats"><datalist id="cats"></datalist></div>
        <div><label for="fQty">Soni</label><input class="inp" id="fQty" type="number" min="0" step="any" required inputmode="decimal"></div>
        <div><label for="fMin">Kam qolgan hisoblansin</label><input class="inp" id="fMin" type="number" min="0" step="any" value="5" inputmode="decimal"></div>
        <div><label for="fCost">Kelgan narxi</label><input class="inp" id="fCost" type="number" min="0" step="any" required inputmode="decimal"></div>
        <div><label for="fSell">Sotish narxi</label><input class="inp" id="fSell" type="number" min="0" step="any" required inputmode="decimal"></div>
      </div>
      <div class="preview"><span>1 dona foyda</span><b id="fGain">-</b></div>
      <div class="foot">
        <button type="button" class="btn" id="cancelBtn" hidden>Bekor qilish</button>
        <button class="btn solid" id="saveBtn">Qo'shish</button>
      </div>
    </form>

    <section>
      <div class="toolbar">
        <label class="field search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="search" type="search" placeholder="Kiritilgan tovarlardan qidirish" aria-label="Qidirish"></label>
        <div class="chips">
          <button class="chip" data-filter="all" aria-pressed="true">Hammasi</button>
          <button class="chip" data-filter="low" aria-pressed="false">Kam qolgan</button>
        </div>
      </div>
      <div class="tbl plist">
        <div class="tr th"><div>Mahsulot</div><div>Qoldiq</div><div>Kelgan narxi</div><div>Sotish narxi</div><div></div></div>
        <div id="plist"></div>
      </div>
    </section>
  </div>

</main>
</div>

<dialog id="dlgRestock"><form class="dlg" id="fRestock" autocomplete="off">
  <h2 id="rName">Kirim</h2>
  <p class="hint">Yangi tovar kelganda qoldiqqa qo'shiladi. Kelgan narxi eski qoldiq bilan o'rtachalanadi.</p>
  <div class="grid2">
    <div><label for="rQty">Nechta keldi</label><input class="inp" id="rQty" type="number" min="0" step="any" required inputmode="decimal"></div>
    <div><label for="rCost">Shu partiyaning narxi (1 dona)</label><input class="inp" id="rCost" type="number" min="0" step="any" required inputmode="decimal"></div>
  </div>
  <div class="foot"><button type="button" class="btn" data-close>Bekor qilish</button><button class="btn solid">Kirim qilish</button></div>
</form></dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
let products = [], editingId = null, restockP = null, q = '';
let filter = params.get('filter') === 'low' ? 'low' : 'all';

async function load() {
  try { products = await api('/api/products'); render(); }
  catch (e) { toast(e.message, true); }
}

function syncChips() { $$('[data-filter]').forEach((c) => c.setAttribute('aria-pressed', c.dataset.filter === filter)); }
$$('[data-filter]').forEach((c) => c.addEventListener('click', () => { filter = c.dataset.filter; syncChips(); render(); }));
$('search').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); render(); });

function render() {
  syncChips();
  $('sub').textContent = `${fmt(products.length)} xil tovar kiritilgan`;
  $('names').innerHTML = products.map((p) => `<option value="${esc(p.name)}">`).join('');
  $('cats').innerHTML = [...new Set(products.map((p) => p.category).filter(Boolean))].map((c) => `<option value="${esc(c)}">`).join('');

  let items = products.filter((p) => !q || p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q));
  if (filter === 'low') items = items.filter((p) => p.quantity <= p.minStock);

  if (!items.length) {
    $('plist').innerHTML = `<div class="empty">${products.length ? 'Hech narsa topilmadi.' : 'Hali tovar yo\'q. Chapdagi formadan birinchisini kiriting.'}</div>`;
    return;
  }
  $('plist').innerHTML = items.map((p) => {
    const low = p.quantity <= p.minStock;
    return `<div class="tr" data-id="${p._id}">
      <div class="pname"><b>${esc(p.name)}</b>${p.category ? `<small>${esc(p.category)}</small>` : ''}</div>
      <div class="qty num"><span class="cl">Qoldiq</span>${fmt(p.quantity)}${p.quantity <= 0 ? '<span class="badge">Tugagan</span>' : low ? '<span class="badge">Kam</span>' : ''}</div>
      <div class="num"><span class="cl">Kelgan narxi</span>${fmt(p.costPrice)}</div>
      <div class="num"><span class="cl">Sotish narxi</span>${fmt(p.sellPrice)}</div>
      <div class="acts">
        <button class="btn sm solid" data-act="restock">Kirim</button>
        <button class="btn sm icon" data-act="edit" aria-label="Tahrirlash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        <button class="btn sm icon danger" data-act="del" aria-label="O'chirish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      </div></div>`;
  }).join('');
}

$('plist').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const p = products.find((x) => x._id === b.closest('.tr').dataset.id); if (!p) return;
  if (b.dataset.act === 'restock') openRestock(p);
  if (b.dataset.act === 'edit') startEdit(p);
  if (b.dataset.act === 'del') {
    if (!confirm(`"${p.name}" o'chirilsinmi? Sotuvlar tarixi saqlanib qoladi.`)) return;
    try { await api('/api/products/' + p._id, 'DELETE'); if (editingId === p._id) resetForm(); toast("O'chirildi"); load(); }
    catch (err) { toast(err.message, true); }
  }
});

function gainPreview() {
  const c = parseFloat($('fCost').value), s = parseFloat($('fSell').value);
  $('fGain').textContent = isNaN(c) || isNaN(s) ? '-' : `${fmt(s - c)} so'm` + (s ? ` (${Math.round(((s - c) / s) * 100)}%)` : '');
}
['fCost', 'fSell'].forEach((id) => $(id).addEventListener('input', gainPreview));

const sameName = (name) => products.find((p) => p.name.trim().toLowerCase() === name.trim().toLowerCase() && p._id !== editingId);
$('fName').addEventListener('input', () => {
  const p = editingId ? null : sameName($('fName').value);
  $('dupe').hidden = !p;
  if (p) { $('dupeTxt').textContent = `Bu tovar bor (qoldiq: ${fmt(p.quantity)}). Yangi tovar kelgan bo'lsa, kirim qiling.`; $('dupeBtn').onclick = () => openRestock(p); }
});

function resetForm() {
  editingId = null;
  $('form').reset();
  $('dupe').hidden = true;
  $('fTitle').textContent = 'Yangi tovar';
  $('saveBtn').textContent = "Qo'shish";
  $('cancelBtn').hidden = true;
  gainPreview();
}
function startEdit(p) {
  editingId = p._id;
  $('fName').value = p.name; $('fCat').value = p.category || ''; $('fQty').value = p.quantity;
  $('fMin').value = p.minStock; $('fCost').value = p.costPrice; $('fSell').value = p.sellPrice;
  $('fTitle').textContent = 'Tovarni tahrirlash';
  $('saveBtn').textContent = 'Saqlash';
  $('cancelBtn').hidden = false;
  $('dupe').hidden = true;
  gainPreview();
  $('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('fName').focus();
}
$('cancelBtn').addEventListener('click', resetForm);

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { name: $('fName').value, category: $('fCat').value, quantity: $('fQty').value, minStock: $('fMin').value, costPrice: $('fCost').value, sellPrice: $('fSell').value };
  if (!editingId && sameName(body.name) && !confirm('Bu nomli tovar allaqachon bor. Baribir yangi tovar sifatida qo\'shilsinmi?\n(Yangi tovar kelgan bo\'lsa, "Kirim" ni ishlating.)')) return;
  $('saveBtn').disabled = true;
  try {
    if (editingId) await api('/api/products/' + editingId, 'PUT', body);
    else await api('/api/products', 'POST', body);
    toast(editingId ? 'Saqlandi' : `Qo'shildi: ${body.name.trim()}`);
    resetForm();
    $('fName').focus();
    await load();
  } catch (err) { toast(err.message, true); }
  finally { $('saveBtn').disabled = false; }
});

/* ---------- Kirim ---------- */
function openRestock(p) {
  restockP = p;
  $('rName').textContent = `Kirim: ${p.name}`;
  $('rQty').value = ''; $('rCost').value = p.costPrice;
  $('dlgRestock').showModal(); $('rQty').focus();
}
$('fRestock').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api(`/api/products/${restockP._id}/restock`, 'POST', { quantity: $('rQty').value, costPrice: $('rCost').value });
    $('dlgRestock').close(); toast(`Kirim qo'shildi: ${restockP.name}`);
    if (!$('dupe').hidden) { resetForm(); }
    await load();
  } catch (err) { toast(err.message, true); }
});

gainPreview();
load().then(() => {
  const id = params.get('restock');
  const p = id && products.find((x) => x._id === id);
  if (p) openRestock(p);
});
</script>
</body>
</html>
